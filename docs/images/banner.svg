<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Deep Agents Backends: a hands-on course">
  <rect width="1280" height="420" fill="#141413"/>
  <!-- storage icons on the right: memory, disk, store, hub, custom -->
  <g transform="translate(860,44)" font-family="Poppins, Arial, Helvetica, sans-serif" font-size="17" font-weight="600">
    <g>
      <circle cx="30" cy="30" r="30" fill="#788C5D"/>
      <rect x="15" y="20" width="30" height="20" rx="3" fill="none" stroke="#FAF9F5" stroke-width="3"/>
      <text x="80" y="36" fill="#FAF9F5">StateBackend</text>
    </g>
    <g transform="translate(0,68)">
      <circle cx="30" cy="30" r="30" fill="#6A9BCC"/>
      <rect x="14" y="22" width="32" height="16" rx="4" fill="none" stroke="#FAF9F5" stroke-width="3"/>
      <text x="80" y="36" fill="#FAF9F5">FilesystemBackend</text>
    </g>
    <g transform="translate(0,136)">
      <circle cx="30" cy="30" r="30" fill="#788C5D"/>
      <ellipse cx="30" cy="21" rx="13" ry="5" fill="none" stroke="#FAF9F5" stroke-width="3"/>
      <path d="M17 21 v18 a13 5 0 0 0 26 0 v-18" fill="none" stroke="#FAF9F5" stroke-width="3"/>
      <text x="80" y="36" fill="#FAF9F5">StoreBackend</text>
    </g>
    <g transform="translate(0,204)">
      <circle cx="30" cy="30" r="30" fill="#6A9BCC"/>
      <circle cx="22" cy="22" r="4" fill="none" stroke="#FAF9F5" stroke-width="3"/>
      <circle cx="38" cy="38" r="4" fill="none" stroke="#FAF9F5" stroke-width="3"/>
      <path d="M22 26 v6 a6 6 0 0 0 6 6 h6" fill="none" stroke="#FAF9F5" stroke-width="3"/>
      <text x="80" y="36" fill="#FAF9F5">ContextHubBackend</text>
    </g>
    <g transform="translate(0,272)">
      <circle cx="30" cy="30" r="30" fill="#D97757"/>
      <path d="M18 30 h24 M30 18 v24" stroke="#FAF9F5" stroke-width="4" stroke-linecap="round"/>
      <text x="80" y="36" fill="#FAF9F5">CompositeBackend</text>
    </g>
  </g>
  <!-- title block -->
  <rect x="72" y="92" width="318" height="40" rx="20" fill="#D97757"/>
  <text x="231" y="118" text-anchor="middle" font-family="Poppins, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">LangChain Deep Agents course</text>
  <text x="72" y="214" font-family="Poppins, Arial, Helvetica, sans-serif" font-size="68" font-weight="800" fill="#FAF9F5">Deep Agents</text>
  <text x="72" y="290" font-family="Poppins, Arial, Helvetica, sans-serif" font-size="68" font-weight="800" fill="#D97757">Backends</text>
  <text x="72" y="338" font-family="Lora, Georgia, serif" font-size="23" fill="#B0AEA5">Where your agent's files live, how long they last,</text>
  <text x="72" y="370" font-family="Lora, Georgia, serif" font-size="23" fill="#B0AEA5">and who can see them. Six hands-on notebooks + slides.</text>
</svg>
